<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Searchable Dropdown</title>
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .dropdown-menu {
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body class="p-4">
  <h4>Select a fruit:</h4>
  <div id="dropdown-root"></div>

  <script type="module">
    import { createSearchableDropdown } from './dropdownComponent.js';

    const fruits = ['Apple', 'Alfalfa', 'Banana', 'Cherry', 'Date', 'Elderberry', 'Fig', 'Grape'];

    const dropdown = createSearchableDropdown({
      options: fruits,
      placeholder: 'Choose a fruit...',
      // onValidSelect: (value) => {
      //   console.log('You selected:', value);
      // },
      className: 'mb-3'
    });

    document.getElementById('dropdown-root').appendChild(dropdown);
  </script>
</body>
</html>
